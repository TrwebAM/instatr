<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Event Feed - Trane</title>
    <!-- Vinculación con el archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>


   

<div class="app-container">
 <!-- PANTALLA DE BIENVENIDA (HOME INICIAL) -->
      
    <!-- PANTALLA DE BIENVENIDA (HOME CON BADGE SUPERIOR) -->
    <div id="home-bienvenida" class="home-overlay">
        
        <!-- 1. NUEVO: BADGE SVG EN LA ESQUINA SUPERIOR DERECHA -->
        <div class="home-badge-container">
            <!-- REEMPLAZA ESTE SVG DE EJEMPLO POR TU CÓDIGO SVG REAL O TU ARCHIVO -->
            <img src="30.svg" alt="Event Badge" class="trane-badge-img">
        </div>
        
        <!-- CAJA CENTRAL: Textos y logotipo -->
        <div class="home-content">
            <div class="brand-text-wrapper">
                <h1 class="trane-main-title">BIENVENIDOS</h1>
                <h2 class="trane-secondary-title">TRANE COLOMBIA</h2>
                <p class="trane-legacy-text">30 YEARS OF LEGACY & BEYOND</p>
                <img src="logos/trane.svg" alt="Trane Logo" class="home-logo">
            </div>
        </div>
        
        <!-- BOTÓN DE ENTRAR EN EL FOOTER -->
        <button id="btn-entrar-app" class="btn-home-start">Entrar</button>

    </div>




    <!-- HEADER PRINCIPAL -->
    <header class="app-header">
        <div class="brand-logo">
            <!-- Logotipo de la compañía Trane -->
            <img src="logos/trane.svg" alt="Trane Logo" class="logo-img">
        </div>
    </header>

    <!-- CARRUSEL VERTICAL CON EFECTO SNAP (ESTILO INSTAGRAM) -->
    <main class="feed-scroll">
        <!-- El contenido se cargará dinámicamente desde Firebase Firestore usando JavaScript -->
        <!-- Mientras conecta, app.js inyectará un mensaje amigable o pantalla de carga -->
    </main>

       <!-- BARRA INFERIOR DE ACCESO RÁPIDO COMPLETA (4 BOTONES) -->
    <nav class="bottom-nav">
        <!-- 1. BOTÓN HOME: Icono de Casita -->
        <svg id="nav-home" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" style="cursor: pointer;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        
        <!-- 2. BOTÓN CÁMARA: Disparador central negro -->
        <button class="nav-trigger" id="btn-camara">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>

        <!-- 3. BOTÓN SCROLL: Flecha para subir directo al último post más reciente -->
                <!-- 3. BOTÓN SCROLL CORREGIDO: Icono universal de "Volver arriba" con barra y flecha -->
        <svg id="nav-scroll-top" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;">
            <path d="M18 3H6M12 21V9M5 16l7-7 7 7"/>
        </svg>

        <!-- 4. BOTÓN COMPARTIR: Icono de Código QR -->
<img src="qr.svg" id="nav-share-qr" alt="Compartir QR" style="cursor: pointer;" width="24" height="24">
    </nav>


    <!-- ========================================== -->
    <!-- VENTANA MODAL 3: COMPARTIR CÓDIGO QR       -->
    <!-- ========================================== -->
    <div id="modal-compartir-qr" class="modal-overlay">
        <div class="modal-content qr-share-modal">
            <h3 class="modal-title">Compartir</h3>
            <p style="text-align: center; font-size: 13px; color: #666; margin-bottom: 20px;">Deja que otros escaneen tu pantalla para unirse a Momentos Trane.</p>
            
            <!-- Aquí el JavaScript inyectará el código QR generado en vivo -->
                        <!-- Cargamos directamente el archivo SVG desde tu carpeta de logos -->
                        <!-- Contenedor optimizado para la inyección nativa del vector SVG -->
            <div id="canvas-qr-compartir" class="qr-code-holder"></div>


            
            <button id="btn-cerrar-share-qr" class="btn-secondary" style="margin-top: 25px; padding: 12px; border-radius: 16px; width: 100%;">Cerrar</button>
        </div>
    </div>

    <!-- MODAL COMENTARIOS Y LIGHTBOX SE MANTIENEN IGUAL ABAJO... -->

    <!-- ========================================== -->
    <!-- VENTANA MODAL 1: PUBLICAR NUEVA FOTO        -->
    <!-- ========================================== -->
    <div id="modal-publicar" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Nueva Publicación</h3>
            
            <!-- Vista previa de la foto capturada por el usuario -->
            <div class="preview-container">
                <img id="img-preview" src="" alt="Vista previa de la captura">
            </div>
            
            <!-- Entrada de texto para el pie de página -->
            <div class="form-group">
                <textarea id="txt-caption" placeholder="Escribe un pie de página para este evento..." maxlength="200"></textarea>
                <div class="char-counter"><span id="char-count">0</span>/200</div>
            </div>
            
            <!-- Botones de control -->
            <div class="modal-actions">
                <button id="btn-cancelar" class="btn-secondary">Cancelar</button>
                <button id="btn-subir" class="btn-primary">Publicar</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VENTANA MODAL 2: COMENTARIOS EN TIEMPO REAL -->
    <!-- ========================================== -->
    <div id="modal-comentarios" class="modal-overlay">
        <div class="modal-content comments-modal">
            <h3 class="modal-title">Comentarios</h3>
            
            <!-- Contenedor con scroll interno para listar las opiniones de Firebase -->
            <div id="lista-comentarios" class="comments-list-container">
                <!-- Se inyecta dinámicamente con JavaScript -->
            </div>
            
            <!-- Caja inferior para escribir y enviar un nuevo comentario -->
            <div class="comment-input-group">
                <input type="text" id="input-nuevo-comentario" placeholder="Añade un comentario anónimo..." maxlength="150">
                <button id="btn-enviar-comentario">Publicar</button>
            </div>
            
            <!-- Botón para ocultar la hoja de comentarios -->
            <button id="btn-cerrar-comentarios" class="btn-secondary" style="margin-top: 10px; padding: 12px; border-radius: 16px;">Cerrar</button>
        </div>
    </div>
     <!-- ========================================== -->
    <!-- VENTANA DE IMAGEN EN PANTALLA COMPLETA     -->
    <!-- ========================================== -->
    <div id="lightbox-foto" class="lightbox-overlay">
        <button id="btn-cerrar-lightbox" class="lightbox-close-btn">&times;</button>
        <div class="lightbox-content-wrapper">
            <img id="img-lightbox-src" src="" alt="Visualización ampliada">
            <!-- AQUÍ SE MOSTRARÁ EL PIE DE PÁGINA EN LA PANTALLA COMPLETA -->
            <p id="txt-lightbox-caption" class="lightbox-caption-text"></p>
        </div>
    </div>

</div>

    <!-- Vinculación del script como Módulo ES6 para soporte nativo de Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
